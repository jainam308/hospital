# Dev profile using H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:opd_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Razorpay Mock Configuration
razorpay.key.id=rzp_test_OPDCareDemoKey
razorpay.key.secret=SecretKeyDemoOPDCare2026
razorpay.currency=INR
razorpay.company.name=OPD Care Hospital
razorpay.mock.mode=true
