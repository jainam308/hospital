# Application Name and Server Port
spring.application.name=opd-backend
server.port=8081

# Profiles
spring.profiles.active=mysql

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/opd_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hikari Connection Pool Resiliency
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# Razorpay Payment Gateway Configuration
razorpay.key.id=rzp_test_OPDCareDemoKey
razorpay.key.secret=SecretKeyDemoOPDCare2026
razorpay.currency=INR
razorpay.company.name=OPD Care Hospital
razorpay.mock.mode=true
